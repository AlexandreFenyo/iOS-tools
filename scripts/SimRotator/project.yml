# Pivote un simulateur iOS depuis la ligne de commande (utilisé par scripts/screenshots.sh
# pour la série iPad paysage) : ni simctl ni l'app elle-même ne savent le faire, et les
# clics via l'Accessibilité de macOS sont refusés. Un test d'interface XCTest, lui, peut
# fixer XCUIDevice.shared.orientation sans aucune autorisation macOS.
#
# Régénérer le projet après modification : cd scripts/SimRotator && xcodegen
name: SimRotator
options:
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    GENERATE_INFOPLIST_FILE: YES
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
targets:
  SimRotatorHost:
    type: application
    platform: iOS
    sources: [Host]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.fenyo.simrotator.host
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
  SimRotatorUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: SimRotatorHost
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.fenyo.simrotator.uitests
        TEST_TARGET_NAME: SimRotatorHost
schemes:
  SimRotator:
    build:
      targets:
        SimRotatorHost: all
        SimRotatorUITests: [test]
    test:
      targets: [SimRotatorUITests]
